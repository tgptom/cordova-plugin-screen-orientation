name: iOS Build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.eslint*'

  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.eslint*'

permissions:
  contents: read

jobs:
  build:
    # Cordova platform package versions (not iOS OS versions).
    name: cordova-ios@${{ matrix.versions.cordova-ios }} build (Xcode ${{ matrix.versions.xcode-version }})
    runs-on: ${{ matrix.versions.os-version }}
    timeout-minutes: 45

    env:
      node-version: 22
      # Pinned Cordova CLI compatible with cordova-ios 7.x and 8.x.
      cordova-cli: 13.0.0

    strategy:
      fail-fast: false
      matrix:
        versions:
          - cordova-ios: 7.x
            os-version: macos-15
            xcode-version: '16.4'

          - cordova-ios: 8.x
            os-version: macos-26
            xcode-version: 26.x

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.node-version }}

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ matrix.versions.xcode-version }}

      - name: Run npm install and plugin tests
        run: |
          npm ci
          npm test

      - name: Install Cordova CLI
        run: npm i -g cordova@${{ env.cordova-cli }}

      - name: Run Environment Information
        run: |
          node --version
          npm --version
          xcodebuild -version
          cordova --version

      - name: Create app, add platform and plugins
        env:
          CORDOVA_IOS: ${{ matrix.versions.cordova-ios }}
        run: |
          APP_DIR="$RUNNER_TEMP/ios-app"
          cordova create "$APP_DIR" org.apache.cordova.screenorientation.test ScreenOrientationTest --no-telemetry
          cd "$APP_DIR"
          cordova platform add "ios@$CORDOVA_IOS" --no-telemetry
          cordova plugin add "$GITHUB_WORKSPACE" --no-telemetry
          cordova plugin add "$GITHUB_WORKSPACE/tests" --no-telemetry
          cordova platform ls --no-telemetry
          cordova plugin ls --no-telemetry

      - name: Clean debug build (simulator)
        run: |
          cd "$RUNNER_TEMP/ios-app"
          cordova clean ios --no-telemetry
          cordova build ios --debug --emulator --no-telemetry
