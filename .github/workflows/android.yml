name: Android Testsuite

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.eslint*'

  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.eslint*'

permissions:
  contents: read

jobs:
  build:
    name: Android Build (cordova-android@${{ matrix.cordova_android }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        cordova_android: ['14.x', '15.x']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build plugin in sample app
        run: |
          npm ci
          npm i -g cordova@12.0.0

          APP_DIR="$RUNNER_TEMP/android-test-app"
          cordova create "$APP_DIR" io.cordova.screenorientation.test ScreenOrientationTest

          cd "$APP_DIR"
          cordova platform add "android@${{ matrix.cordova_android }}"
          cordova plugin add "$GITHUB_WORKSPACE"
          cordova build android --debug --no-telemetry
