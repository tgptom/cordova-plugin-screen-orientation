name: Android Build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.eslint*'

  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.eslint*'

permissions:
  contents: read

jobs:
  build:
    # Cordova platform package versions (not Android OS / API levels).
    name: cordova-android@${{ matrix.cordova-android }} build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      node-version: 22
      # Pinned Cordova CLI compatible with cordova-android 14.x and 15.x.
      cordova-cli: 13.0.0
      # cordova-android 14.x (AGP 8.7) and 15.x (AGP 8.10) both require JDK 17.
      java-distro: temurin
      java-version: 17

    strategy:
      fail-fast: false
      matrix:
        cordova-android:
          - 14.x
          - 15.x

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.node-version }}

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ env.java-distro }}
          java-version: ${{ env.java-version }}

      - name: Run npm install and plugin tests
        run: |
          npm ci
          npm test

      - name: Install Cordova CLI
        run: npm i -g cordova@${{ env.cordova-cli }}

      - name: Run Environment Information
        run: |
          node --version
          npm --version
          java -version
          cordova --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Create app, add platform and plugins
        env:
          CORDOVA_ANDROID: ${{ matrix.cordova-android }}
        run: |
          APP_DIR="$RUNNER_TEMP/android-app"
          cordova create "$APP_DIR" org.apache.cordova.screenorientation.test ScreenOrientationTest --no-telemetry
          cd "$APP_DIR"
          cordova platform add "android@$CORDOVA_ANDROID" --no-telemetry
          cordova plugin add "$GITHUB_WORKSPACE" --no-telemetry
          cordova plugin add "$GITHUB_WORKSPACE/tests" --no-telemetry
          cordova platform ls --no-telemetry
          cordova plugin ls --no-telemetry

      - name: Clean debug build
        run: |
          cd "$RUNNER_TEMP/android-app"
          cordova clean android --no-telemetry
          cordova build android --debug --no-telemetry
